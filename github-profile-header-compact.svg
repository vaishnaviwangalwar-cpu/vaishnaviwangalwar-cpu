<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" width="700" height="210" font-family="'JetBrains Mono', 'Space Mono', 'Consolas', 'Menlo', monospace">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ecb2ff" flood-opacity="0.35"/>
    </filter>
    <clipPath id="typeClip">
      <rect x="64" y="130" width="0" height="28">
        <animate attributeName="width"
          dur="36.2s" repeatCount="indefinite"
          calcMode="linear"
          keyTimes="0;0.0884;0.1436;0.1878;0.2017;0.2900;0.3453;0.3895;0.4033;0.4834;0.5387;0.5787;0.5925;0.6698;0.7251;0.7638;0.7776;0.8797;0.9350;0.9862;1"
          values="0;384;384;0;0;384;384;0;0;348;348;0;0;336;336;0;0;444;444;0;0"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="210" fill="#0b0b0b"/>

  <!-- Terminal window -->
  <rect x="20" y="15" width="660" height="180" rx="8" fill="#1a0033" fill-opacity="0.55" stroke="#ecb2ff" stroke-opacity="0.55" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Header bar -->
  <path d="M20,23 a8,8 0 0 1 8,-8 h624 a8,8 0 0 1 8,8 v26 h-640 z" fill="#353534"/>
  <line x1="20" y1="49" x2="680" y2="49" stroke="#ecb2ff" stroke-opacity="0.2"/>

  <!-- Traffic-light dots -->
  <circle cx="42" cy="32" r="5" fill="#ff4b89"/>
  <circle cx="58" cy="32" r="5" fill="#dabaf7"/>
  <circle cx="74" cy="32" r="5" fill="#ecb2ff"/>

  <!-- Header label -->
  <text x="350" y="36" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#d4c0d7">&gt;_ root@github:~</text>

  <!-- Boot log lines -->
  <text x="40" y="70" font-size="13" fill="#ff4b89" fill-opacity="0.8">&gt;_</text>
  <text x="60" y="70" font-size="13" fill="#ecb2ff" fill-opacity="0.8">[SYSTEM] Loading Neural Network... OK</text>

  <text x="40" y="90" font-size="13" fill="#ff4b89" fill-opacity="0.8">&gt;_</text>
  <text x="60" y="90" font-size="13" fill="#ecb2ff" fill-opacity="0.8">[MODULE] Initializing TensorFlow/PyTorch... SUCCESS</text>

  <text x="40" y="110" font-size="13" fill="#ff4b89" fill-opacity="0.8">&gt;_</text>
  <text x="60" y="110" font-size="13" fill="#ecb2ff" fill-opacity="0.8">[DATA] Processing Dataset: Training... 94%</text>

  <!-- Typewriter line -->
  <text x="40" y="148" font-size="20" font-weight="600" fill="#ff4b89">&gt;_</text>

  <g clip-path="url(#typeClip)">
    <text x="64" y="148" font-size="20" font-weight="600" fill="#ecb2ff" textLength="384" lengthAdjust="spacingAndGlyphs">
      <animate attributeName="opacity" dur="36.2s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.2017;1" values="1;0;0"/>
      Initializing Neural Networks...
    </text>
    <text x="64" y="148" font-size="20" font-weight="600" fill="#ecb2ff" textLength="384" lengthAdjust="spacingAndGlyphs">
      <animate attributeName="opacity" dur="36.2s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.2017;0.4033;1" values="0;1;0;0"/>
      Loading TensorFlow &amp; PyTorch...
    </text>
    <text x="64" y="148" font-size="20" font-weight="600" fill="#ecb2ff" textLength="348" lengthAdjust="spacingAndGlyphs">
      <animate attributeName="opacity" dur="36.2s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.4033;0.5925;1" values="0;1;0;0"/>
      Processing Large Datasets...
    </text>
    <text x="64" y="148" font-size="20" font-weight="600" fill="#ecb2ff" textLength="336" lengthAdjust="spacingAndGlyphs">
      <animate attributeName="opacity" dur="36.2s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.5925;0.7776;1" values="0;1;0;0"/>
      Optimizing Model Weights...
    </text>
    <text x="64" y="148" font-size="20" font-weight="600" fill="#ecb2ff" textLength="444" lengthAdjust="spacingAndGlyphs">
      <animate attributeName="opacity" dur="36.2s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.7776;1" values="0;1;0"/>
      AI / Machine Learning / Data Science
    </text>
  </g>

  <!-- Blinking cursor, tracks the tip of the typed text -->
  <rect y="132" width="3" height="20" fill="#ecb2ff">
    <animate attributeName="x"
      dur="36.2s" repeatCount="indefinite"
      calcMode="linear"
      keyTimes="0;0.0884;0.1436;0.1878;0.2017;0.2900;0.3453;0.3895;0.4033;0.4834;0.5387;0.5787;0.5925;0.6698;0.7251;0.7638;0.7776;0.8797;0.9350;0.9862;1"
      values="64;448;448;64;64;448;448;64;64;412;412;64;64;400;400;64;64;508;508;64;64"/>
    <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0"/>
  </rect>

  <!-- Footer divider -->
  <line x1="40" y1="168" x2="660" y2="168" stroke="#ecb2ff" stroke-opacity="0.1"/>

  <!-- Footer stats -->
  <text x="40" y="190" font-size="12" font-weight="700" letter-spacing="1" fill="#d4c0d7" fill-opacity="0.6">&lt;/&gt; DEVELOPER</text>
  <text x="180" y="190" font-size="12" font-weight="700" letter-spacing="1" fill="#d4c0d7" fill-opacity="0.6">● ONLINE</text>
  <text x="660" y="190" text-anchor="end" font-size="12" font-weight="700" letter-spacing="2" fill="#ff4b89" fill-opacity="0.8">V 2.0.4</text>
</svg>
